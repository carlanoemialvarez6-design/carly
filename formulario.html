<div class="formulario">
  <h1>Suscribirse</h1>
  <p>Completa todos los campos para registrarte.</p>

  <form id="miFormulario">
<div class="Formulario de Registro"
    <label>Nombre</label>
    <input type="text" id="nombre" placeholder="Ej. JUAN CARLOS" maxlength="50" required>
    <small>Solo letras mayúsculas</small>

    <label>Apellido paterno</label>
    <input type="text" id="paterno" placeholder="Ej. PÉREZ" maxlength="30" required>
    <small>Solo letras mayúsculas</small>

    <label>Apellido materno</label>
    <input type="text" id="materno" placeholder="Ej. GARCÍA" maxlength="30" required>
    <small>Solo letras mayúsculas</small>

    <label>Fecha de nacimiento</label>
    <input type="date" id="fechaNacimiento" required>
    <small>Selecciona día, mes y año en el calendario</small>

    <label>Edad</label>
    <input type="text" id="edad" placeholder="Ej. 25" maxlength="3" inputmode="numeric" required>
    <small>Solo números</small>

    <label>Numero de tarjeta</label>
    <input type="text" id="tarjeta" placeholder="Ej. 5512341234565678" maxlength="16" inputmode="numeric" required>
    <small>Solo 16 números, sin letras</small>

     <div id="mensajeExito"></div>   
    <button type="submit">REGISTRARSE</button>

  </form>
</div>
<script src="script.js"></script>
</body>
